services:
  - type: web
    name: sri-seva-connect-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: sri-seva-connect-api
      - key: JWT_AUDIENCE
        value: sri-seva-connect-mobile
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_DAYS
        value: 30
      - key: ORGANIZATION_ID
        value: 404c3836-64c4-4394-8f56-7de5322294d5
      - key: ORGANIZATION_NAME
        value: Sri Seva Connect
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        value: http://localhost:8081,http://127.0.0.1:8081
      - key: TRUST_PROXY
        value: true
